{% extends 'base.html' %}
{% block title %}Register — PhotoBook{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="auth-sub">Register as a customer to book sessions and view your photos.</p>

    <div id="error-box" class="form-error" style="display:none;"></div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Choose a username" required>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="Your email address" required>
    </div>
    <div class="form-group">
      <label>Phone <span class="text-muted">(optional)</span></label>
      <input type="text" id="phone" placeholder="Your phone number">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Create a password" required>
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="password2" placeholder="Repeat your password" required>
    </div>

    <button onclick="registerUser()" class="btn btn-primary btn-full">Create Account</button>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  async function registerUser() {
    const errorBox = document.getElementById('error-box');
    errorBox.style.display = 'none';

    const body = {
      username:  document.getElementById('username').value,
      email:     document.getElementById('email').value,
      phone:     document.getElementById('phone').value,
      password:  document.getElementById('password').value,
      password2: document.getElementById('password2').value,
    };

    // POST to the DRF API endpoint
    const res = await fetch('/api/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
      body: JSON.stringify(body),
    });

    if (res.ok) {
      // Registration worked — redirect to login
      window.location.href = '/login/';
    } else {
      const data = await res.json();
      // Show the error messages from the serializer
      const msgs = Object.values(data).flat().join(' ');
      errorBox.textContent = msgs;
      errorBox.style.display = 'block';
    }
  }

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }
</script>
{% endblock %}
